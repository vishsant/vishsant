name: Refresh profile telemetry
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - ref/gitascii.json
      - assets/portrait.svg
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Fetch live GitHub data and render local assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate.py --login "$PROFILE_LOGIN"
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/header.svg assets/bio.svg assets/telemetry.svg assets/snake.svg assets/activity.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile telemetry"
            git push
          fi
